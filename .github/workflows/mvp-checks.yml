name: MVP checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [mvp-request-offer-contractor]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python syntax
        run: python -m py_compile app.py
      - name: Node syntax
        run: node --check firma-constructii-app/index.js
      - name: Pilot page exists
        run: grep -q "Contractor Digital Navigator" firma-constructii-app/public/navigator.html
